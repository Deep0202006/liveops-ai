[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-machine-rul-predictor"
version = "0.1.0"
description = "Lightweight academic Remaining Useful Life prediction pipeline"
requires-python = ">=3.12,<3.15"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "fastapi>=0.116,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
app = ["streamlit>=1.41,<2", "httpx>=0.28,<1"]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "streamlit>=1.41,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
